services:
  linklock:
    build:
      context: ./backend
    container_name: linklock-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:4000"
    env_file:
      - ./backend/.env
    volumes:
      - linklock-data:/app/data
      - linklock-uploads:/app/uploads

volumes:
  linklock-data:
  linklock-uploads:
